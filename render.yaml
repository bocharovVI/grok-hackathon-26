# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Static SPA on Render CDN. The site cannot use private-network hostnames;
# VITE_API_URL must be a public HTTPS origin (set in the dashboard, then redeploy).
services:
  - type: web
    name: medical-history-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        fromDatabase:
          name: medical-history-db
          property: connectionString
      - key: XAI_API_KEY
        sync: false
      - key: XAI_MODEL
        value: grok-4.6
      - key: XAI_REASONING_EFFORT
        value: low
      - key: XAI_TIMEOUT_SECONDS
        value: "300"
      - key: PUBLIC_API_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
  - type: web
    name: anketa-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    previews:
      generation: automatic
    buildFilter:
      paths:
        - frontend/**
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: VITE_API_URL
        sync: false
      - key: VITE_USE_MOCK
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY

databases:
  - name: medical-history-db
    plan: basic-256mb
    databaseName: medical_history
    user: medical
    ipAllowList: []
